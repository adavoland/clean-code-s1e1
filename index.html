<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <section class="reference-link-img">
      <img src="./eisenhower-matrix.jpg" alt="the eisenhower-matrix image">
      <a class="reference-link-img__more-inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </section>
    <section class="centered-main-page-element">
      <h3> Add Item </h3>
      <p id="centered-main-page-element__top-section-for-adding-element-to-list">
        <div class="centered-main-page-element__task-row-wrapper">
          <input id="centered-main-page-element__new-task" class="centered-main-page-element__task" type="text">
          <button>Add</button>
        </div>
      </p>
      <h3>Todo</h3>
      <ul id="incomplete-tasks">
        <li>
          <input type="checkbox">
          <label class="incomplete-tasks__task">Pay Bills</label>
          <input type="text" class="task">
          <button class="incomplete-tasks__edit">Edit</button>
          <button class="incomplete-tasks__delete">
            <img src="./remove.svg" alt="remove sign">
          </button>
        </li>
        <li class="edit-mode">
          <input type="checkbox">
          <label class="edit-mode__task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="edit-mode__task">
          <button class="edit-mode__edit">Save</button>
          <button class="edit-mode__delete">
            <img src="./remove.svg" alt="remove sign">
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked>
          <label class="completed-tasks__task">See the Doctor</label>
          <input type="text" class="task">
          <button class="completed-tasks__edit">Edit</button>
          <button class="completed-tasks__delete">
            <img src="./remove.svg" alt="remove sign">
          </button>
        </li>
      </ul>
    </section>
  <script src="app.js"></script>
  </body>
</html>
